<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esmiringhoy auction - Online Auction</title>
<style>
:root{--paper:#f2f4f7;--ink:#101828;--mute:#5b6577;--line:#d5dae3;--blue:#2446d8;--amber:#b45309;--green:#1f8a5b;--red:#b42318;--r:6px}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,"Segoe UI",sans-serif}
.serif,h1,h2,h3{font-family:"Iowan Old Style",Palatino,Georgia,serif}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 20px;background:var(--ink);color:#fff}
header .brand{font-size:22px;font-weight:700}
header .who{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
main{max-width:760px;margin:0 auto;padding:20px}
h1{font-size:30px;margin:8px 0}h2{font-size:24px;margin:24px 0 4px}h3{font-size:20px;margin:0}
p{margin:4px 0}.mute{color:var(--mute)}
input,textarea,button{font:inherit;border-radius:var(--r)}
input,textarea{width:100%;padding:10px;border:1px solid var(--line);background:#fff;color:var(--ink)}
label{display:block;margin:12px 0 4px;font-weight:600}
button{padding:10px 16px;border:0;background:var(--blue);color:#fff;cursor:pointer}
button.alt{background:transparent;color:inherit;border:1px solid currentColor}
button.big{display:block;width:100%;padding:22px;text-align:left;margin:12px 0;font-size:18px}
button.big small{display:block;font-weight:400;opacity:.85}
:focus-visible{outline:3px solid #f5a524;outline-offset:2px}
.tabs{display:flex;gap:8px;margin:12px 0}
.tabs button{flex:1}.tabs button:not(.on){background:transparent;color:var(--ink);border:1px solid var(--line)}
.lot{display:grid;grid-template-columns:1fr auto;gap:8px 20px;padding:18px 0;border-bottom:1px solid var(--line)}
.price{text-align:right}.price b{display:block;font-size:32px;line-height:1.1}
.time{color:var(--amber);font-weight:700}
.bidrow{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bidrow input{max-width:200px}
.msg{padding:10px 14px;border-radius:var(--r);margin:12px 0}
.ok{background:#e3f4ec;color:#14533a}.bad{background:#fde8e6;color:var(--red)}
.tag{font-weight:700;color:var(--green)}
@media(max-width:520px){.lot{grid-template-columns:1fr}.price{text-align:left}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
</head>
<body>
<div id="app"></div>

<script>
// ---------- 1. PASTE YOUR SUPABASE DETAILS HERE ----------
const SUPABASE_URL = "https://draeogtvyeulzavoutrm.supabase.co";      // example: https://abcdxyz.supabase.co
const SUPABASE_KEY = "sb_publishable_NDIMtZRl4o_sNn1JhZVAGQ_mQQyZoGl";   // never use the service_role key

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ---------- STATE ----------
let user = null, profile = null, items = [], mode = null, tab = "login", flash = "", flashBad = false;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "$" + Number(n).toLocaleString();
const isDone = i => i.settled || new Date(i.ends_at) <= new Date();

function say(msg, bad) { flash = msg; flashBad = !!bad; render(); }

// ---------- DATA ----------
async function refresh() {
  if (!user) return;
  await sb.rpc("settle_items");                         // end finished auctions
  const p = await sb.from("profiles").select("*").eq("id", user.id).single();
  const it = await sb.from("items").select("*").order("id", { ascending: false });
  if (p.data) profile = p.data;
  if (it.data) items = it.data;
  render();
}

// ---------- ACTIONS ----------
async function auth(kind) {
  const email = $("e").value.trim(), pass = $("p").value;
  if (!email || pass.length < 6) return say("Enter your email and a password of 6+ characters.", true);
  let res;
  if (kind === "up") {
    const name = $("u").value.trim();
    if (name.length < 3) return say("Choose a username of 3+ characters.", true);
    res = await sb.auth.signUp({ email, password: pass, options: { data: { username: name } } });
    if (!res.error && !res.data.session) return say("Account created. Check your email to confirm it, then log in.");
  } else {
    res = await sb.auth.signInWithPassword({ email, password: pass });
  }
  if (res.error) return say(res.error.message, true);
  user = res.data.user; mode = null; flash = ""; await refresh();
}
async function logout() { await sb.auth.signOut(); user = profile = null; items = []; mode = null; flash = ""; render(); }
function setMode(m) { mode = m; flash = ""; render(); }

async function placeBid(id) {
  const amount = Math.floor(Number($("a" + id).value));
  if (!(amount >= 1)) return say("Enter how much you want to bid.", true);
  const { error } = await sb.rpc("place_bid", { p_item: id, p_amount: amount });
  if (error) { await refresh(); return say(error.message, true); }
  await refresh(); say("Bid placed: " + money(amount) + ".");
}
async function addItem() {
  const { error } = await sb.rpc("create_item", {
    p_title: $("t").value, p_desc: $("d").value,
    p_start: Math.floor(Number($("s").value)), p_minutes: Number($("m").value)
  });
  if (error) return say(error.message, true);
  await refresh(); say("Your item is now up for auction.");
}

// ---------- VIEWS ----------
function left(ts) {
  const s = Math.max(0, Math.floor((new Date(ts) - Date.now()) / 1000));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + "h " : "") + m + "m " + String(x).padStart(2, "0") + "s left";
}
const msgHtml = () => flash ? `<p class="msg ${flashBad ? "bad" : "ok"}" role="status">${esc(flash)}</p>` : "";

function authView() {
  const up = tab === "up";
  return `<header><span class="brand serif">Esmiringhoy Auction</span></header><main>
  <h1>Welcome to Esmiringhoy Auction</h1><p class="mute">New accounts start with $1,000 to bid with.</p>
  <div class="tabs">
    <button class="${up ? "" : "on"}" onclick="tab='login';flash='';render()">Log in</button>
    <button class="${up ? "on" : ""}" onclick="tab='up';flash='';render()">Sign up</button>
  </div>${msgHtml()}
  ${up ? `<label for="u">Username</label><input id="u">` : ""}
  <label for="e">Email</label><input id="e" type="email" autocomplete="email">
  <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')auth('${tab}')">
  <p><button style="margin-top:16px" onclick="auth('${tab}')">${up ? "Create account" : "Log in"}</button></p></main>`;
}

function chooseView() {
  return `<main><h1>What do you want to do, ${esc(profile.username)}?</h1>
  <button class="big" onclick="setMode('bid')">Bid on items<small>Scroll through the lots and bid with your balance.</small></button>
  <button class="big" onclick="setMode('sell')">Give an item for auction<small>Set a title, a starting bid, and how long the auction runs.</small></button></main>`;
}

function lot(i, controls) {
  const mine = i.seller === user.id, lead = i.bidder === user.id, done = isDone(i);
  let c = "";
  if (controls && !done) {
    c = mine ? `<p class="bidrow mute">This is your item.</p>`
      : `<div class="bidrow"><input id="a${i.id}" type="number" min="1" aria-label="Amount to bid on lot ${i.id}" placeholder="Amount to use" onkeydown="if(event.key==='Enter')placeBid(${i.id})"><button onclick="placeBid(${i.id})">Place bid</button>${lead ? `<span class="tag">You are the highest bidder</span>` : ""}</div>`;
  }
  const status = done
    ? (i.bidder ? `Sold to ${esc(i.bidder_name)}${lead ? " (you won this lot)" : ""}` : "Ended with no bids")
    : `<span class="time" data-end="${esc(i.ends_at)}">${left(i.ends_at)}</span>`;
  return `<article class="lot"><div><h3>Lot ${i.id}: ${esc(i.title)}</h3><p>${esc(i.description)}</p><p class="mute">Seller: ${esc(i.seller_name)}</p></div>
  <div class="price"><span class="mute">${i.bidder ? (done ? "Final bid" : "Current bid") : "Starting bid"}</span><b class="serif">${money(i.bidder ? i.current_bid : i.start_bid)}</b><span>${status}</span></div>${c}</article>`;
}

function dashView() {
  let body = "";
  if (mode === "bid") {
    const open = items.filter(i => !isDone(i)), shut = items.filter(i => isDone(i) && (i.seller === user.id || i.bidder === user.id));
    body = `<h1>Open lots</h1><p class="mute">Enter how much of your balance to use, then place your bid.</p>${msgHtml()}`
      + (open.length ? open.map(i => lot(i, true)).join("") : `<p>No auctions are open right now. Switch role to list the first item.</p>`)
      + (shut.length ? `<h2>Your results</h2>` + shut.map(i => lot(i, false)).join("") : "");
  } else {
    const mine = items.filter(i => i.seller === user.id);
    body = `<h1>Give an item for auction</h1>${msgHtml()}
    <label for="t">Item title</label><input id="t" maxlength="60">
    <label for="d">Description</label><textarea id="d" rows="3" maxlength="200"></textarea>
    <label for="s">Starting bid ($)</label><input id="s" type="number" min="1">
    <label for="m">Auction length (minutes)</label><input id="m" type="number" min="1" value="10">
    <p><button style="margin-top:16px" onclick="addItem()">List item</button></p>
    <h2>Your items</h2>` + (mine.length ? mine.map(i => lot(i, false)).join("") : `<p class="mute">You have not listed anything yet.</p>`);
  }
  return `<header><span class="brand serif">Esmiringhoy Auction</span><div class="who"><span>${esc(profile.username)}</span><span>Balance: <b>${money(profile.balance)}</b></span>
  <button class="alt" onclick="setMode(null)">Switch role</button><button class="alt" onclick="logout()">Log out</button></div></header><main>${body}</main>`;
}

function render() {
  $("app").innerHTML = !user || !profile ? authView() : !mode ? chooseView() : dashView();
}

// ---------- START ----------
(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) { user = data.session.user; await refresh(); } else render();
})();

// Every second update the countdowns; every 5 seconds reload the latest data from Supabase.
let ticks = 0;
setInterval(() => {
  ticks++;
  document.querySelectorAll("[data-end]").forEach(e => e.textContent = left(e.dataset.end));
  const ended = items.some(i => !i.settled && new Date(i.ends_at) <= new Date());
  const typing = document.activeElement && ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName);
  if (user && (ended || ticks % 5 === 0) && !typing) refresh();
}, 1000);
</script>
</body>
</html>
