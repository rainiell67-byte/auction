.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.toolbar input{flex:1;min-width:180px}

<body>
<div id="app"></div>

<script>
// ---------- 1. YOUR SUPABASE DETAILS ----------
const SUPABASE_URL = "https://draeogtvyeulzavoutrm.supabase.co";
const SUPABASE_KEY = "sb_publishable_NDIMtZRl4o_sNn1JhZVAGQ_mQQyZoGl";   // never use the service_role key

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ---------- STATE ----------
let user = null, profile = null, items = [], myBids = new Set(), mode = null, tab = "login", flash = "", flashBad = false;
let draft = { u: "", e: "" };
let recovering = location.hash.includes("type=recovery");   // true when opened from a password-reset email
let q = "", sort = "ending", txs = [], form = { t: "", d: "", s: "", m: "10" };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "$" + Number(n).toLocaleString();
const isDone = i => i.settled || new Date(i.ends_at) <= new Date();

function say(msg, bad) { flash = msg; flashBad = !!bad; render(); }

// ---------- DATA ----------
async function refresh() {
  if (!user) return;
  await sb.rpc("settle_items");                         // end finished auctions
  const p = await sb.from("profiles").select("*").eq("id", user.id).single();
  const it = await sb.from("items").select("*").order("id", { ascending: false });
  const b = await sb.from("bids").select("item_id").eq("bidder", user.id);
  if (b.data) myBids = new Set(b.data.map(x => x.item_id));
  const tx = await sb.from("transactions").select("*").order("id", { ascending: false }).limit(100);
  if (tx.data) txs = tx.data;
  if (p.data) profile = p.data;
  if (it.data) items = it.data;
  render();
}

// ---------- ACTIONS ----------
async function _auth(kind) {
  const email = $("e").value.trim(), pass = $("p").value;
  draft = { u: $("u") ? $("u").value : "", e: email };
  if (!email || pass.length < 6) return say("Enter your email and a password of 6+ characters.", true);
  let res;
  if (kind === "up") {
    const name = $("u").value.trim();
    if (name.length < 3) return say("Choose a username of 3+ characters.", true);
    res = await sb.auth.signUp({ email, password: pass, options: { data: { username: name } } });
    if (!res.error && !res.data.session) return say("Account created. Check your email to confirm it, then log in.");
  } else {
    res = await sb.auth.signInWithPassword({ email, password: pass });
  }
  if (res.error) return say(res.error.message, true);
  user = res.data.user; mode = null; flash = ""; await refresh();
}
async function logout() { await sb.auth.signOut(); user = profile = null; items = []; mode = null; flash = ""; render(); }
function setMode(m) { mode = m; flash = ""; render(); }

async function _addFunds(n) {
  const amount = Math.floor(Number(n));
  if (!(amount >= 1)) return say("Enter an amount of $1 or more.", true);
  const { error } = await sb.rpc("add_balance", { p_amount: amount });
  if (error) return say(error.message, true);
  await refresh(); say(money(amount) + " added to your balance.");
}
async function _placeBid(id) {
  const amount = Math.floor(Number($("a" + id).value));
  if (!(amount >= 1)) return say("Enter how much you want to bid.", true);
  const { error } = await sb.rpc("place_bid", { p_item: id, p_amount: amount });
  if (error) { await refresh(); return say(error.message, true); }
  await refresh(); say("Bid placed: " + money(amount) + ".");
}
// Double-click protection: while one action is running, other clicks are ignored
let busy = false;
const once = fn => async (...a) => {
  if (busy) return;
  busy = true; document.body.classList.add("busy");
  try { await fn(...a); } finally { busy = false; document.body.classList.remove("busy"); }
};

async function _cancelItem(id) {
  if (!confirm("Cancel this listing? This cannot be undone.")) return;
  const { error } = await sb.rpc("cancel_item", { p_item: id });
  if (error) { await refresh(); return say(error.message, true); }
  await refresh(); say("Your listing was cancelled.");
}
async function _sendReset() {
  const email = $("e").value.trim(); draft.e = email;
  if (!email) return say("Enter your email first.", true);
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  if (error) return say(error.message, true);
  say("If that email has an account, a reset link is on its way. Check your inbox and spam folder.");
}
async function _setNewPassword() {
  const pass = $("p").value;
  if (pass.length < 6) return say("Use a password of 6+ characters.", true);
  const { error } = await sb.auth.updateUser({ password: pass });
  if (error) return say(error.message, true);
  recovering = false; history.replaceState(null, "", location.pathname);
  const { data } = await sb.auth.getSession();
  user = data.session ? data.session.user : null; mode = null; flash = "";
  if (user) { await refresh(); say("Your password was changed."); } else render();
}
const auth = once(_auth), placeBid = once(_placeBid), addFunds = once(_addFunds), addItem = once(_addItem),
      cancelItem = once(_cancelItem), sendReset = once(_sendReset), setNewPassword = once(_setNewPassword);

const cur = i => i.bidder ? i.current_bid : i.start_bid;
function quick(id, v) { const el = $("a" + id); el.value = v; el.focus(); }
function lotsHtml() {
  const w = q.trim().toLowerCase();
  const a = groups().bid.filter(i => !w || (i.title + " " + (i.description || "") + " " + i.seller_name).toLowerCase().includes(w));
  const by = { ending: (x, y) => new Date(x.ends_at) - new Date(y.ends_at), high: (x, y) => cur(y) - cur(x), low: (x, y) => cur(x) - cur(y), newest: (x, y) => y.id - x.id };
  a.sort(by[sort]);
  return a.length ? a.map(i => lot(i, true)).join("") : `<div class="empty">${w ? "No lots match your search." : "No auctions are open right now."}</div>`;
}
function paintLots() { $("lots").innerHTML = lotsHtml(); }
const toolbar = () => `<div class="toolbar"><input id="q" type="search" aria-label="Search lots" placeholder="Search lots" value="${esc(q)}" oninput="q=this.value;paintLots()">
  <select id="sort" aria-label="Sort lots" onchange="sort=this.value;paintLots()">${[["ending", "Ending soon"], ["high", "Highest bid"], ["low", "Lowest bid"], ["newest", "Newest"]].map(([k, l]) => `<option value="${k}"${sort === k ? " selected" : ""}>${l}</option>`).join("")}</select></div>`;

// Makes a big phone photo smaller (max 1000px) so it uploads fast
function shrink(file) {
  return new Promise((ok, no) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1000 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(blob => { URL.revokeObjectURL(url); blob ? ok(blob) : no(); }, "image/jpeg", 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); no(); };
    img.src = url;
  });
}
function preview(input) {
  const p = $("prev"), f = input.files[0];
  if (f) { p.src = URL.createObjectURL(f); p.hidden = false; } else p.hidden = true;
}
async function _addItem() {
  form = { t: $("t").value, d: $("d").value, s: $("s").value, m: $("m").value };
  const f = $("img").files[0];
  let img = "";
  if (f) {
    if (!f.type.startsWith("image/")) return say("Please choose an image file.", true);
    try {
      const blob = await shrink(f), path = `${user.id}/${Date.now()}.jpg`;
      const up = await sb.storage.from("item-photos").upload(path, blob, { contentType: "image/jpeg" });
      if (up.error) return say("Photo upload failed: " + up.error.message, true);
      img = sb.storage.from("item-photos").getPublicUrl(path).data.publicUrl;
    } catch (e) { return say("That photo could not be read. Try a JPG or PNG.", true); }
  }
  const { error } = await sb.rpc("create_item", {
    p_title: $("t").value, p_desc: $("d").value,
    p_start: Math.floor(Number($("s").value)), p_minutes: Number($("m").value), p_image: img
  });
  if (error) return say(error.message, true);
  form = { t: "", d: "", s: "", m: "10" };
  await refresh(); say("Your item is now up for auction.");
}

function togglePw() {
  const i = $("p"), b = $("pwb"), show = i.type === "password";
  i.type = show ? "text" : "password";
  b.textContent = show ? "Hide" : "Show";
  b.setAttribute("aria-pressed", show);
  b.setAttribute("aria-label", show ? "Hide password" : "Show password");
}

// ---------- VIEWS ----------
function left(ts) {
  const s = Math.max(0, Math.floor((new Date(ts) - Date.now()) / 1000));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + "h " : "") + m + "m " + String(x).padStart(2, "0") + "s left";
}
const msgHtml = () => flash ? `<p class="msg ${flashBad ? "bad" : "ok"}" role="status">${esc(flash)}</p>` : "";

const hdr = () => `<header><span class="brand">Fiducia Auction</span><div class="who"><span>${esc(profile.username)}</span><span class="pill">Balance ${money(profile.balance)}</span>
  <button class="alt" onclick="setMode(null)">Switch role</button><button class="alt" onclick="logout()">Log out</button></div></header>`;

const fundsPanel = () => `<section class="card"><h3>Add balance</h3><p class="mute">This is a demo top-up. No real money is used.</p>
  <div class="bidrow" style="border:0;padding-top:12px"><button class="alt" onclick="addFunds(100)">+ $100</button><button class="alt" onclick="addFunds(500)">+ $500</button><button class="alt" onclick="addFunds(1000)">+ $1,000</button>
  <input id="fund" type="number" min="1" aria-label="Custom amount to add" placeholder="Other amount"><button onclick="addFunds($('fund').value)">Add</button></div></section>`;

const forgotView = () => `<header><span class="brand">Fiducia Auction</span></header><main class="auth">
  <div class="hero"><h1>Reset password</h1><p class="mute">We will email you a link to choose a new one</p></div>
  <div class="authcard card">${msgHtml()}
  <label for="e">Email</label><input id="e" type="email" autocomplete="email" value="${esc(draft.e)}" onkeydown="if(event.key==='Enter')sendReset()">
  <p><button style="margin-top:18px;width:100%" onclick="sendReset()">Send reset link</button></p>
  <p style="text-align:center;margin-top:14px"><button type="button" class="link" onclick="tab='login';flash='';render()">Back to log in</button></p></div></main>`;

const resetView = () => `<header><span class="brand">Fiducia Auction</span></header><main class="auth">
  <div class="hero"><h1>New password</h1><p class="mute">Choose a new password for your account</p></div>
  <div class="authcard card">${msgHtml()}
  <label for="p">New password</label><div class="pw"><input id="p" type="password" autocomplete="new-password" onkeydown="if(event.key==='Enter')setNewPassword()"><button type="button" id="pwb" class="eye" aria-pressed="false" aria-label="Show password" onclick="togglePw()">Show</button></div>
  <p><button style="margin-top:18px;width:100%" onclick="setNewPassword()">Save new password</button></p></div></main>`;

function authView() {
  if (tab === "forgot") return forgotView();
  const up = tab === "up";
  return `<header><span class="brand">Fiducia Auction</span></header><main class="auth">
  <div class="hero"><h1>Fiducia Auction</h1><p class="mute">Where every bid is made in good faith.</p></div>
  <div class="authcard card"><p class="mute">New accounts start with $0. After you log in, add balance to start bidding.</p>
  <div class="tabs">
    <button class="${up ? "" : "on"}" onclick="tab='login';flash='';render()">Log in</button>
    <button class="${up ? "on" : ""}" onclick="tab='up';flash='';render()">Sign up</button>
  </div>${msgHtml()}
  ${up ? `<label for="u">Username</label><input id="u" value="${esc(draft.u)}">` : ""}
  <label for="e">Email</label><input id="e" type="email" autocomplete="email" value="${esc(draft.e)}">
  <label for="p">Password</label><div class="pw"><input id="p" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')auth('${tab}')"><button type="button" id="pwb" class="eye" aria-pressed="false" aria-label="Show password" onclick="togglePw()">Show</button></div>
  <p><button style="margin-top:18px;width:100%" onclick="auth('${tab}')">${up ? "Create account" : "Log in"}</button></p>${up ? "" : `<p style="text-align:center;margin-top:14px"><button type="button" class="link" onclick="tab='forgot';flash='';render()">Forgot your password?</button></p>`}</div></main>`;
}

function chooseView() {
  return `${hdr()}<main><h1>Welcome, ${esc(profile.username)}</h1><p class="mute">What would you like to do today?</p>${msgHtml()}
  <div class="choices">
  <button class="big" onclick="setMode('bid')">Bid on items<small>Browse the lots and bid with your balance.</small></button>
  <button class="big" onclick="setMode('sell')">Auction an item<small>Set a title, a starting bid, and how long it runs.</small></button></div>${fundsPanel()}</main>`;
}

function lot(i, controls) {
  const mine = i.seller === user.id, lead = i.bidder === user.id, done = isDone(i);
  const base = cur(i), min = i.bidder ? i.current_bid + 1 : i.start_bid;
  let c = "";
  if (controls && !done) {
    c = mine ? `<p class="bidrow mute">This is your item.</p>`
      : `<div class="bidrow"><span class="minbid" style="flex-basis:100%">Minimum next bid: ${money(min)}</span><input id="a${i.id}" type="number" min="1" aria-label="Amount to bid on lot ${i.id}" placeholder="Amount to use" onkeydown="if(event.key==='Enter')placeBid(${i.id})">${[10, 50, 100].map(n => `<button type="button" class="alt chip" onclick="quick(${i.id},${base + n})">+$${n}</button>`).join("")}<button onclick="placeBid(${i.id})">Place bid</button>${lead ? `<span class="tag">You are the highest bidder</span>` : myBids.has(i.id) ? `<span class="tag out">You were outbid</span>` : ""}</div>`;
  }
  if (mine && !done && !i.bidder && mode === "mine")
    c = `<div class="bidrow"><span class="minbid">No bids yet, so you can still cancel this listing.</span><button type="button" class="alt" onclick="cancelItem(${i.id})">Cancel listing</button></div>`;
  const urgent = new Date(i.ends_at) - Date.now() < 60000 ? " urgent" : "";
  const status = done
    ? (i.bidder ? `Sold to ${esc(i.bidder_name)}${lead ? " (you won this lot)" : ""}` : "Ended with no bids")
    : `<span class="time${urgent}" data-end="${esc(i.ends_at)}">${left(i.ends_at)}</span>`;
  return `<article class="card lot"><div class="lotl">${i.image_url ? `<img class="pic" src="${esc(i.image_url)}" alt="" onerror="this.remove()">` : ""}<div><span class="lotno">Lot ${i.id}</span><h3>${esc(i.title)}</h3><p>${esc(i.description)}</p><p class="mute">Seller: ${esc(i.seller_name)}</p></div></div>
  <div class="price"><span class="mute">${i.bidder ? (done ? "Final bid" : "Current bid") : "Starting bid"}</span><b class="serif">${money(i.bidder ? i.current_bid : i.start_bid)}</b><span>${status}</span></div>${c}</article>`;
}

function groups() {
  const me = user.id, bid = i => myBids.has(i.id);
  return {
    bid: items.filter(i => !isDone(i)),
    mine: items.filter(i => i.seller === me),
    bidding: items.filter(i => !isDone(i) && bid(i)),
    won: items.filter(i => isDone(i) && i.bidder === me),
    lost: items.filter(i => isDone(i) && bid(i) && i.bidder !== me)
  };
}
const NAV = [["bid", "Browse lots"], ["sell", "Auction an item"], ["mine", "My items"], ["bidding", "My bids"], ["won", "Won"], ["lost", "Lost"], ["history", "History"]];
const nav = g => `<nav class="side" aria-label="Sections"><b>My account</b>${NAV.map(([k, l]) =>
  `<button class="${mode === k ? "on" : ""}" onclick="setMode('${k}')">${l}${g[k] && k !== "bid" ? " (" + g[k].length + ")" : ""}</button>`).join("")}</nav>`;

function dashView() {
  const g = groups();
  const titles = { mine: "My items", bidding: "Items I am bidding on", won: "Auctions I won", lost: "Auctions I lost" };
  const none = { mine: "You have not listed anything yet.", bidding: "You have no active bids.", won: "You have not won any auctions yet.", lost: "You have not lost any auctions." };
  let body;
  if (mode === "bid") {
    body = `<h1>Open lots</h1><p class="mute">Enter how much of your balance to use, then place your bid.</p>${msgHtml()}`
      + (profile.balance < 1 ? `<p class="msg bad">Your balance is $0. Add balance below before bidding.</p>` : "") + fundsPanel()
      + toolbar() + `<div id="lots">${lotsHtml()}</div>`;
  } else if (mode === "sell") {
    body = `<h1>Auction an item</h1>${msgHtml()}<section class="card">
    <label for="t">Item title</label><input id="t" maxlength="60" value="${esc(form.t)}">
    <label for="d">Description</label><textarea id="d" rows="3" maxlength="200">${esc(form.d)}</textarea>
    <label for="s">Starting bid ($)</label><input id="s" type="number" min="1" value="${esc(form.s)}">
    <label for="m">Auction length (minutes)</label><input id="m" type="number" min="1" value="${esc(form.m)}">
    <label for="img">Photo (optional)</label><input id="img" type="file" accept="image/*" onchange="preview(this)"><img id="prev" class="pic" alt="Photo preview" hidden>
    <p><button style="margin-top:18px" onclick="addItem()">List item</button></p></section>`;
  } else if (mode === "history") {
    body = `<h1>Transaction history</h1>${msgHtml()}` + (txs.length
      ? `<div class="card" style="overflow-x:auto"><table class="tx"><thead><tr><th>Date</th><th>Type</th><th>Details</th><th class="r">Amount</th></tr></thead><tbody>${txs.map(t =>
        `<tr><td>${esc(new Date(t.created_at).toLocaleString())}</td><td>${esc(t.kind)}</td><td>${esc(t.note)}</td><td class="r ${t.amount < 0 ? "neg" : "pos"}">${t.amount < 0 ? "-" : "+"}${money(Math.abs(t.amount))}</td></tr>`).join("")}</tbody></table></div>`
      : `<div class="empty">No transactions yet.</div>`);
  } else {
    body = `<h1>${titles[mode]}</h1>${msgHtml()}`
      + (g[mode].length ? g[mode].map(i => lot(i, mode === "bidding")).join("") : `<div class="empty">${none[mode]}</div>`);
  }
  return `${hdr()}<main class="shell">${nav(g)}<div>${body}</div></main>`;
}

function render() {
  $("app").innerHTML = recovering ? resetView() : !user || !profile ? authView() : !mode ? chooseView() : dashView();
}

// ---------- START ----------
sb.auth.onAuthStateChange(ev => { if (ev === "PASSWORD_RECOVERY") { recovering = true; render(); } });
(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session && !recovering) { user = data.session.user; await refresh(); } else render();
})();

// Every second update the countdowns; every 5 seconds reload the latest data from Supabase.
let ticks = 0;
setInterval(() => {
  ticks++;
  document.querySelectorAll("[data-end]").forEach(e => {
    e.textContent = left(e.dataset.end);
    e.classList.toggle("urgent", new Date(e.dataset.end) - Date.now() < 60000);
  });
  const ended = items.some(i => !i.settled && new Date(i.ends_at) <= new Date());
  const typing = document.activeElement && ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName);
  if (user && (ended || ticks % 5 === 0) && !typing) refresh();
}, 1000);
</script>
</body>
</html>
